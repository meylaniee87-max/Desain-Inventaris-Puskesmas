<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Aset Baru - INV-TECH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #1e293b;
            --accent-blue: #3b82f6;
            --bg-light: #f8fafc;
            --white: #ffffff;
            --border: #e2e8f0;
            --text-gray: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-light); color: #334155; padding: 40px; display: flex; justify-content: center; }

        .form-container {
            background: var(--white);
            width: 100%;
            max-width: 800px;
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        .form-header h2 { font-family: 'Poppins'; font-size: 22px; color: var(--primary-color); }

        .btn-back {
            text-decoration: none;
            color: var(--text-gray);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .btn-back:hover { color: var(--accent-blue); }

        /* Grid System Form */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width { grid-column: span 2; }

        .input-group { margin-bottom: 20px; }
        
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--primary-color);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 14px;
            transition: 0.3s;
            outline: none;
            background: #fdfdfd;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            background: white;
        }

        /* Styling File Upload */
        .file-upload {
            border: 2px dashed var(--border);
            padding: 30px;
            text-align: center;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        .file-upload:hover { border-color: var(--accent-blue); background: #f0f7ff; }
        .file-upload i { font-size: 30px; color: var(--text-gray); margin-bottom: 10px; }

        .form-footer {
            margin-top: 30px;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .btn-submit {
            background: var(--accent-blue);
            color: white;
            padding: 14px 30px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:hover { background: #2563eb; transform: translateY(-2px); }

        .btn-cancel {
            background: #f1f5f9;
            color: #64748b;
            padding: 14px 30px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            <div>
                <a href="dashboard_admin.html" class="btn-back"><i class="fas fa-arrow-left"></i> Kembali</a>
                <h2 style="margin-top: 10px;">Registrasi Aset Baru</h2>
            </div>
            <i class="fas fa-boxes-stacked" style="font-size: 40px; color: #e2e8f0;"></i>
        </div>

        <form action="#">
            <div class="form-grid">
                <div class="input-group">
                    <label>ID Aset (Barcode/Serial)</label>
                    <input type="text" placeholder="Contoh: #EL-2023-001" required>
                </div>

                <div class="input-group">
                    <label>Kategori Aset</label>
                    <select required>
                        <option value="" disabled selected>Pilih Kategori</option>
                        <option value="elektronik">Elektronik / Laptop</option>
                        <option value="furniture">Furniture</option>
                        <option value="kendaraan">Kendaraan Dinas</option>
                        <option value="network">Perangkat Jaringan</option>
                    </select>
                </div>

                <div class="input-group full-width">
                    <label>Nama Perangkat / Nama Aset</label>
                    <input type="text" placeholder="Masukkan nama lengkap perangkat" required>
                </div>

                <div class="input-group">
                    <label>Lokasi Penempatan</label>
                    <input type="text" placeholder="Contoh: Lab Komputer 1">
                </div>

                <div class="input-group">
                    <label>Kondisi Awal</label>
                    <select>
                        <option value="baru">Baru (New)</option>
                        <option value="baik">Bekas (Baik)</option>
                        <option value="rekondisi">Rekondisi</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Nilai Aset (Harga Perolehan)</label>
                    <input type="number" placeholder="Rp 0">
                </div>

                <div class="input-group">
                    <label>Tanggal Pembelian</label>
                    <input type="date">
                </div>

                <div class="input-group full-width">
                    <label>Foto Aset</label>
                    <div class="file-upload" onclick="document.getElementById('foto').click()">
    <i class="fas fa-cloud-upload-alt"></i>
    <p id="file-name" style="font-size: 13px; color: var(--text-gray);">Klik atau seret gambar ke sini (JPG, PNG max 2MB)</p>
    <input type="file" style="display: none;" id="foto" accept="image/*" onchange="previewFileName()">
</div>
                </div>

                <div class="input-group full-width">
                    <label>Catatan / Spesifikasi Tambahan</label>
                    <textarea rows="4" placeholder="Masukkan rincian spesifikasi seperti RAM, Processor, atau No Plat Kendaraan..."></textarea>
                </div>
            </div>

            <div class="form-footer">
    <a href="dashboard_admin.html" class="btn-cancel">Batalkan</a>
    <button type="submit" class="btn-submit">Simpan Aset ke Database</button>
</div>
        </form>
    </div>
<script>
    // Fungsi untuk memicu klik pada input file yang tersembunyi
    function triggerFileClick() {
        document.getElementById('foto').click();
    }

    // Fungsi untuk menampilkan nama file yang dipilih
    function previewFileName() {
        const fileInput = document.getElementById('foto');
        const fileNameDisplay = document.getElementById('file-name');
        if (fileInput.files.length > 0) {
            fileNameDisplay.innerHTML = `<strong>File Terpilih:</strong> ${fileInput.files[0].name}`;
            fileNameDisplay.style.color = "#3b82f6";
        }
    }

    // --- LOGIKA UTAMA SIMPAN DAN PINDAH HALAMAN ---
    document.querySelector('form').addEventListener('submit', function(e) {
        // Berhenti sejenak agar form tidak langsung refresh halaman
        e.preventDefault(); 

        // 1. Ambil Data dari Input
        const idAset = document.querySelector('input[placeholder*="#EL"]').value;
        const namaAset = document.querySelector('input[placeholder*="nama lengkap"]').value;
        const kategori = document.querySelector('select').value;
        const lokasi = document.querySelector('input[placeholder*="Lab Komputer"]').value;
        const kondisi = document.querySelectorAll('select')[1].value;

        // 2. Simpan ke Objek
        const dataBaru = {
            id: idAset,
            nama: namaAset,
            kategori: kategori,
            lokasi: lokasi,
            kondisi: kondisi
        };

        // 3. Masukkan ke LocalStorage (Titipan Memori Browser)
        let daftarAset = JSON.parse(localStorage.getItem('dataAset')) || [];
        daftarAset.push(dataBaru);
        localStorage.setItem('dataAset', JSON.stringify(daftarAset));

        // 4. Munculkan Notifikasi
        alert("Aset Berhasil Disimpan ke Database!");

        // 5. PINDAH KE DASHBOARD (Pastikan nama file tujuan benar)
        window.location.href = "dashboard_admin.html";
    });
</script>
</body>
</html>
