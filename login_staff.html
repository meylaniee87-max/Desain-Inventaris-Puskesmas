<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Portal - INV-TECH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --staf-primary: #10b981; 
            --staf-bg-light: #f0fdf4;
            --staf-accent: #34d399;
            --text-dark: #0f172a;
            --text-gray: #64748b;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            display: flex;
            background: var(--white);
            width: 100%;
            max-width: 950px;
            min-height: 580px;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(16, 185, 129, 0.15);
        }

        .visual-side {
            flex: 1.1;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px;
            text-align: center;
            color: white;
            position: relative;
        }

        .visual-side::after {
            content: "";
            position: absolute;
            width: 100%; height: 100%;
            background-image: radial-gradient(rgba(255,255,255,0.1) 1.5px, transparent 0);
            background-size: 24px 24px;
            top: 0; left: 0;
        }

        .visual-side img {
            width: 85%;
            z-index: 1;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.15));
            margin-bottom: 30px;
            animation: float 4s ease-in-out infinite;
            border-radius: 20px; /* Tambahan agar gambar kotak lebih rapi */
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .visual-side h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            z-index: 1;
            margin-bottom: 10px;
        }

        .visual-side p {
            font-size: 14px;
            opacity: 0.9;
            line-height: 1.6;
            z-index: 1;
            max-width: 280px;
        }

        .form-side {
            flex: 1;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        .logo-icon {
            background: var(--staf-primary);
            color: white;
            padding: 8px;
            border-radius: 10px;
            font-size: 18px;
        }

        .logo-text {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 20px;
            color: var(--text-dark);
            letter-spacing: -0.5px;
        }

        .welcome-text h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 28px;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .welcome-text p {
            color: var(--text-gray);
            font-size: 14px;
            margin-bottom: 35px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-box {
            position: relative;
        }

        .input-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            transition: 0.3s;
        }

        .input-box input {
            width: 100%;
            padding: 14px 15px 14px 48px;
            background: #f1f5f9;
            border: 2px solid transparent;
            border-radius: 16px;
            outline: none;
            font-size: 14px;
            transition: all 0.3s;
        }

        .input-box input:focus {
            background: white;
            border-color: var(--staf-primary);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        .input-box input:focus + i {
            color: var(--staf-primary);
        }

        .form-footer {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 30px;
        }

        .forgot-link {
            color: var(--staf-primary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--staf-primary);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:hover {
            background: #059669;
            transform: translateY(-3px);
            box-shadow: 0 20px 25px -5px rgba(16, 185, 129, 0.4);
        }

        @media (max-width: 850px) {
            .visual-side { display: none; }
            .login-container { max-width: 450px; }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="visual-side">
            <img src="img/WhatsApp Image 2025-12-24 at 23.18.04.jpeg" alt="Inventory Illustration">
            <h2>Portal Anggota Staf</h2>
            <p>Akses katalog barang dan ajukan peminjaman aset dengan satu klik mudah.</p>
        </div>

        <div class="form-side">
            <div class="brand-logo">
                <div class="logo-icon"><i class="fas fa-box-open"></i></div>
                <div class="logo-text">INV-TECH</div>
            </div>

            <div class="welcome-text">
                <h1>Halo, Rekan!</h1>
                <p>Silakan masuk untuk mulai mengelola kebutuhan aset Anda.</p>
            </div>

            <form id="loginForm" onsubmit="return false;">
                <div class="form-group">
                    <label>ID Karyawan / Email</label>
                    <div class="input-box">
                        <i class="fas fa-id-card"></i>
                        <input type="text" id="userInput" placeholder="Masukkan ID atau Email Staf" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Kata Sandi</label>
                    <div class="input-box">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="passInput" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-footer">
                    <a href="lupa_sandi.html" class="forgot-link" style="text-decoration: none; color: var(--text-mute); font-size: 13px;">Lupa kata sandi?</a>
                </div>

                <button type="button" class="btn-login" onclick="masukKeDashboard()">
                    Masuk ke Portal <i class="fas fa-chevron-right"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        function masukKeDashboard() {
            const user = document.getElementById('userInput').value;
            const pass = document.getElementById('passInput').value;

            // Validasi sederhana: pastikan tidak kosong
            if (user === "" || pass === "") {
                alert("Harap isi ID dan Kata Sandi Anda!");
                return;
            }

            // Beri efek loading pada tombol
            const btn = document.querySelector('.btn-login');
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Loading...';
            btn.style.opacity = '0.8';

            // Pindah halaman setelah 500ms
            setTimeout(() => {
                window.location.href = 'dashboard_staff.html';
            }, 500);
        }

        // Agar tombol 'Enter' di keyboard juga berfungsi
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                masukKeDashboard();
            }
        });
    </script>

</body>
</html>
