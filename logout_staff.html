<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging Out - INV-TECH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg: #f8fafc;
            --text-main: #0f172a;
            --text-mute: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logout-container {
            text-align: center;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.8s ease-out;
        }

        /* --- ANIMASI ICON --- */
        .icon-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
        }

        .main-circle {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: var(--primary);
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            position: relative;
            z-index: 2;
        }

        .spinner {
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px;
            border: 3px solid transparent;
            border-top-color: var(--primary);
            border-radius: 40%;
            animation: spin 2s linear infinite;
            z-index: 1;
        }

        /* --- TEXT --- */
        h2 {
            font-family: 'Poppins';
            font-size: 24px;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        p {
            color: var(--text-mute);
            font-size: 15px;
            line-height: 1.6;
        }

        /* --- PROGRESS BAR --- */
        .progress-container {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 10px;
            margin-top: 40px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        /* --- ANIMATIONS --- */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- FOOTER BRAND --- */
        .brand {
            position: absolute;
            bottom: 40px;
            font-weight: 700;
            font-size: 14px;
            color: #cbd5e1;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="logout-container">
        <div class="icon-wrapper">
            <div class="spinner"></div>
            <div class="main-circle">
                <i class="fas fa-power-off"></i>
            </div>
        </div>

        <h2>Sampai Jumpa!</h2>
        <p>Terima kasih telah bekerja dengan hebat hari ini. Kami sedang mengamankan sesi Anda...</p>

        <div class="progress-container">
            <div class="progress-bar" id="bar"></div>
        </div>
    </div>

    <div class="brand">INV-TECH SYSTEM</div>

    <script>
        // Simulasi Progress Bar & Redirect
        let width = 0;
        const bar = document.getElementById('bar');
        
        const interval = setInterval(() => {
            if (width >= 100) {
                clearInterval(interval);
                // Redirect ke halaman login setelah 100%
                window.location.href = 'login_staff.html'; 
            } else {
                width += 1;
                bar.style.width = width + '%';
            }
        }, 25); // 2.5 detik total proses
    </script>
</body>
</html>
