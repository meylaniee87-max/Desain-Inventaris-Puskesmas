<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Log Perbaikan - INV-TECH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #1e293b;
            --accent: #3b82f6;
            --bg: #f8fafc;
            --white: #ffffff;
            --border: #e2e8f0;
            --text-main: #334155;
            --text-sub: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); padding: 30px; display: flex; justify-content: center; }

        .container { width: 100%; max-width: 800px; }

        /* Header Design */
        .form-header { margin-bottom: 30px; display: flex; align-items: center; gap: 20px; }
        .back-circle { 
            width: 45px; height: 45px; background: var(--white); border: 1px solid var(--border);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: var(--text-main); text-decoration: none; transition: 0.3s;
        }
        .back-circle:hover { background: var(--primary); color: white; }
        .form-header h1 { font-family: 'Poppins'; font-size: 22px; }

        /* Card Form */
        .main-card {
            background: var(--white);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.02);
        }

        .section-title { 
            font-size: 14px; font-weight: 700; text-transform: uppercase; 
            letter-spacing: 1px; color: var(--accent); margin-bottom: 25px;
            display: flex; align-items: center; gap: 10px;
        }

        /* Grid System */
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .full { grid-column: span 2; }

        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        
        input, select, textarea {
            width: 100%; padding: 14px 16px; border-radius: 12px;
            border: 1px solid var(--border); background: #fcfdfe;
            font-size: 14px; outline: none; transition: 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); background: white;
        }

        /* Progres Slider Custom */
        .range-wrapper { padding: 10px 0; }
        input[type="range"] { height: 6px; background: #e2e8f0; border: none; cursor: pointer; }

        /* Action Buttons */
        .footer-btns { 
            margin-top: 20px; display: flex; justify-content: flex-end; gap: 15px; 
            padding-top: 30px; border-top: 1px solid #f1f5f9;
        }
        .btn { 
            padding: 14px 28px; border-radius: 12px; font-weight: 600; font-size: 14px; 
            cursor: pointer; border: none; transition: 0.3s; display: flex; align-items: center; gap: 8px;
        }
        .btn-cancel { background: #f1f5f9; color: var(--text-sub); text-decoration: none; }
        .btn-save { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(30, 41, 59, 0.2); }
        .btn-save:hover { transform: translateY(-2px); filter: brightness(1.2); }

        @media (max-width: 600px) { .input-grid { grid-template-columns: 1fr; } .full { grid-column: span 1; } }
    </style>
</head>
<body>

    <div class="container">
        <div class="form-header">
            <a href="monitoring_maintenance.html" class="back-circle"><i class="fas fa-chevron-left"></i></a>
            <div>
                <h1>Input Log Perbaikan</h1>
                <p style="font-size: 13px; color: var(--text-sub);">Dokumentasikan proses teknis perbaikan aset.</p>
            </div>
        </div>

        <div class="main-card">
            <form action="#">
                <div class="section-title">
                    <i class="fas fa-info-circle"></i> Identitas Aset & Kerusakan
                </div>
                
                <div class="input-grid">
                    <div class="full">
                        <label>Pilih Aset yang Diperbaiki</label>
                        <select required>
                            <option value="">-- Cari Kode atau Nama Aset --</option>
                            <option value="1">#PR-002 - Printer Epson L3110</option>
                            <option value="2">#MN-088 - Monitor Dell UltraSharp</option>
                            <option value="3">#AS-005 - MacBook Air M1</option>
                        </select>
                    </div>

                    <div>
                        <label>Teknisi Penanggung Jawab</label>
                        <input type="text" placeholder="Nama Teknisi" required>
                    </div>

                    <div>
                        <label>Kategori Masalah</label>
                        <select>
                            <option>Hardware (Fisik)</option>
                            <option>Software (Sistem)</option>
                            <option>Maintenance Rutin</option>
                        </select>
                    </div>
                </div>

                <div class="section-title">
                    <i class="fas fa-sync-alt"></i> Status & Progres
                </div>

                <div class="input-grid">
                    <div class="full">
                        <label>Deskripsi Tindakan / Perbaikan</label>
                        <textarea rows="3" placeholder="Apa saja yang sudah dikerjakan?"></textarea>
                    </div>

                    <div class="range-wrapper full">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <label>Progres Pengerjaan (%)</label>
                            <span id="rangeVal" style="font-weight: 700; color: var(--accent);">50%</span>
                        </div>
                        <input type="range" min="0" max="100" value="50" oninput="document.getElementById('rangeVal').innerText = this.value + '%'">
                    </div>

                    <div>
                        <label>Status Saat Ini</label>
                        <select>
                            <option>Proses Pengerjaan</option>
                            <option>Menunggu Sparepart</option>
                            <option>Testing / QC</option>
                            <option>Selesai Sempurna</option>
                        </select>
                    </div>

                    <div>
                        <label>Estimasi Tanggal Selesai</label>
                        <input type="date" required>
                    </div>
                </div>

                <div class="footer-btns">
                    <a href="monitoring_maintenance.html" class="btn btn-cancel">Batal</a>
                    <button type="submit" class="btn btn-save" onclick="alert('Log Perbaikan Berhasil Disimpan!')">
                        <i class="fas fa-check-double"></i> Simpan Data Log
                    </button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
